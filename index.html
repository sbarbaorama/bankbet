<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BankBet</title>
  <meta name="description" content="Gestione scommesse e bankroll con Kelly e Masaniello">
  <meta name="theme-color" content="#0D1411">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="5" width="28" height="20" rx="4" fill="var(--accent)"/><circle cx="1" cy="15" r="3.5" fill="var(--bg)"/><circle cx="29" cy="15" r="3.5" fill="var(--bg)"/><path d="M10 10h6.5a2.5 2.5 0 0 1 0 5H10zm0 5h7.5a2.5 2.5 0 0 1 0 5H10z" fill="none" stroke="var(--bg)" stroke-width="2"/></svg>
      <span>BANKBET</span>
    </div>
    <div class="topbar-right">
      <div class="balance" id="topBalance"></div>
      <button class="icon-btn" id="syncBtn" title="Sincronizza" aria-label="Sincronizza" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <a href="#home" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="#bets" data-view="bets"><svg viewBox="0 0 24 24"><path d="M4 5h16v4a3 3 0 0 0 0 6v4H4v-4a3 3 0 0 0 0-6z"/></svg><span>Schedine</span></a>
    <a href="#tools" data-view="tools"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h8"/></svg><span>Strumenti</span></a>
    <a href="#stats" data-view="stats"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span>Statistiche</span></a>
    <a href="#bankroll" data-view="bankroll"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M16 13h.01M2 10h20"/></svg><span>Bankroll</span></a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <button class="fab" id="fab" aria-label="Nuova scommessa" title="Nuova scommessa">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog id="dialog"><form method="dialog" id="dialogForm" novalidate></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
